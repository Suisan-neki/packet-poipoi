name: Deploy dashboard demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install and build
        working-directory: dashboard
        env:
          GITHUB_PAGES: "true"
          GITHUB_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm run build
          mkdir -p dist/tools
          cp -R ../tools/shelfpdf dist/tools/shelfpdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify ShelfPDF public page
        run: |
          URL="https://suisan-neki.github.io/packet-poipoi/tools/shelfpdf/"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "$URL" | grep -q "ShelfPDF Web"; then
              echo "Verified $URL"
              exit 0
            fi
            sleep 5
          done
          echo "Published page did not return the expected content." >&2
          exit 1

      - name: Record verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/deploy-status.md <<EOF
          # ShelfPDF deployment status

          - Status: verified
          - Commit: ${GITHUB_SHA}
          - URL: https://suisan-neki.github.io/packet-poipoi/tools/shelfpdf/
          - Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          CONTENT="$(base64 -w 0 /tmp/deploy-status.md)"
          CURRENT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/tools/shelfpdf/DEPLOY_STATUS.md" --jq .sha 2>/dev/null || true)"
          if [[ -n "$CURRENT_SHA" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/tools/shelfpdf/DEPLOY_STATUS.md" \
              -f message="Update ShelfPDF deployment status" \
              -f content="$CONTENT" \
              -f sha="$CURRENT_SHA" \
              -f branch="main"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/tools/shelfpdf/DEPLOY_STATUS.md" \
              -f message="Record ShelfPDF deployment status" \
              -f content="$CONTENT" \
              -f branch="main"
          fi
